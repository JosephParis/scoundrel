<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Sigil</title>
    <meta name="description" content="A roguelite deckbuilder. Forge your kit, take a Boon, face the Trial, and earn ten sigils to escape." />

    <!-- Matches --color-dungeon in src/index.css, so the browser chrome does not
         sit at a different shade from the page behind it. -->
    <meta name="theme-color" content="#0b0d12" />

    <!-- Icons. The SVG is preferred where supported and stays sharp at any size;
         the 32px PNG covers browsers that do not take SVG favicons, and
         favicon.ico exists only so clients that blindly probe /favicon.ico get a
         file rather than a 404. Regenerate with `node scripts/generate-icons.mjs`. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Sigil" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Social cards. __SITE_URL__ is substituted at build time by the
         htmlSiteUrl plugin in vite.config.js; it resolves to the deployment's
         origin, or to '' locally, which leaves these as relative paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sigil" />
    <meta property="og:title" content="Sigil — forge your kit, take a Boon, face the Trial" />
    <meta property="og:description" content="A roguelite deckbuilder. Your forged weapons and potions shuffle in with the dungeon's monsters. Earn ten sigils to escape." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Sigil mark above the game's title." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sigil — forge your kit, take a Boon, face the Trial" />
    <meta name="twitter:description" content="A roguelite deckbuilder. Earn ten sigils to escape." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
