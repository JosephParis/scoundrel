<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Social share card, 1200x630. Rasterised to public/og-image.png by
       scripts/generate-icons.mjs; the PNG is what ships, so the system serif used
       here is resolved once at authoring time rather than by any viewer. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#1b1408"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#fbbf24" stroke-opacity="0.22" stroke-width="3"/>

  <!-- Sigil, echoing the favicon -->
  <g transform="translate(600 210) scale(2.5) translate(-32 -32)">
    <path d="M32 7 Q36.5 27.5 57 32 Q36.5 36.5 32 57 Q27.5 36.5 7 32 Q27.5 27.5 32 7 Z" fill="#fbbf24"/>
  </g>

  <text x="600" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="120" letter-spacing="16" fill="#f5e6c8">KNELL</text>

  <text x="600" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="34" fill="#fbbf24" fill-opacity="0.85">A roguelike deckbuilder of one bad night</text>

  <text x="600" y="545" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="25" fill="#94a3b8">Forge your kit &#183; descend blind &#183; ten sigils to escape</text>
</svg>
