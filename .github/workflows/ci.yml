name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  # So the expensive all-tests job can be run on demand rather than only after a
  # merge. Without this, a change to that job -- or to a spec only it runs --
  # cannot be verified until it is already on main.
  workflow_dispatch:

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # Sub-second and needs no browser, so it belongs on every push rather than
      # only in the main-branch all-tests job.
      - name: Run unit tests
        run: npm run test:unit

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 7

  mobile-tests:
    name: Mobile Responsive Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run mobile responsive tests
        run: npm run test:mobile

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures
          path: test-results/
          retention-days: 7

  # Optional: Run all Playwright tests (not just mobile)
  all-tests:
    name: All Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-build
    # Only run on main branch to save CI minutes, or on demand.
    # TEMPORARY: steam/desktop-shell is listed so the xvfb change below can be
    # verified before it reaches main. Remove that clause before merging.
    if: >-
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      || github.event_name == 'workflow_dispatch'
      || github.head_ref == 'steam/desktop-shell'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # visual/steam-build.spec.js launches the real Electron main process, and
      # Electron needs a display even to open a window it never shows. Without
      # xvfb the launch fails on a headless runner with an error about the X
      # display, which reads like a Playwright problem and is not one. Only this
      # job needs it -- the mobile job runs headless Chromium, which does not.
      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      - name: Run all tests
        run: xvfb-run -a npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-tests-report
          path: playwright-report/
          retention-days: 30
